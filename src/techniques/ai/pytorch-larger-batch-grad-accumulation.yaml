id: ai.pytorch-larger-batch-grad-accumulation
domain: ai
title: Increase batch size or use gradient accumulation to raise training throughput
kind: guided
riskClass: lossy
stacks:
  - pytorch
bottlenecks:
  - inference
  - data_loading
signals:
  - GPU memory is mostly free and utilization is low with small batches (profiler shows many short kernels, nvidia-smi shows spare memory)
  - Per-step overhead is a large share of step time at the current batch size
preconditions:
  - User opted into changing training dynamics; validation metric available
  - Learning rate and schedule can be retuned
steps:
  - Raise the batch size until memory is nearly full (activation checkpointing with torch.utils.checkpoint can free memory and allow a larger batch) and re-tune the learning rate
  - Or accumulate gradients over N micro-batches before optimizer.step() to keep the effective batch size, dividing each micro-batch loss by N; with a GradScaler call scaler.update() only after a full effective batch has been stepped
  - With DistributedDataParallel wrap the first N-1 micro-batches in model.no_sync() so gradients all-reduce only on the last
  - Compare samples per second and validation metric to convergence
verification:
  - Samples per second rises and the validation metric reaches the same quality in comparable or less wall time
traps:
  - Larger effective batch changes optimization behavior and may need learning-rate and warmup changes
  - BatchNorm computes its statistics per forward batch (per micro-batch when accumulating), so accumulation is not equivalent to a larger batch for batch-norm models
  - zero_grad(set_to_none=True) is the default in current PyTorch; None gradients behave differently from zeros, for example an optimizer skips a parameter whose grad is None but steps with a zero gradient, which matters with momentum or weight decay
  - Without no_sync, DDP all-reduces after every backward, wasting accumulation benefit
expectedEffect: Higher throughput when the GPU was underfilled; convergence per step changes; measure time to target quality.
sources:
  - https://docs.pytorch.org/tutorials/recipes/recipes/tuning_guide.html
  - https://docs.pytorch.org/docs/2.14/notes/amp_examples.html
  - https://docs.pytorch.org/docs/2.14/generated/torch.optim.Optimizer.zero_grad.html
  - https://docs.pytorch.org/docs/2.14/generated/torch.nn.BatchNorm2d.html
verifiedIn: unverified
