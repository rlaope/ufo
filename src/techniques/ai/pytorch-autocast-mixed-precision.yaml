id: ai.pytorch-autocast-mixed-precision
domain: ai
title: Use torch.autocast mixed precision for training and inference
kind: guided
riskClass: numeric
stacks:
  - pytorch
bottlenecks:
  - inference
  - cpu
signals:
  - Profiler shows matmul/convolution kernels in float32 dominating step time on a GPU with Tensor Cores
  - Training runs in full float32 with ample memory headroom but low throughput
preconditions:
  - GPU with fast float16 or bfloat16 support (Tensor Cores on Volta or newer) or CPU with bfloat16
  - "Quality oracle: loss curve or validation metric to compare with float32"
steps:
  - 'Wrap only the forward pass and loss in with torch.autocast(device_type="cuda"): keep backward() and optimizer.step() outside'
  - For float16 add torch.amp.GradScaler (scale the loss, unscale before the step); for bfloat16 a GradScaler is not needed
  - Do not call .half() or .bfloat16() on the model or inputs; autocast casts per op
  - Use dimensions that are multiples of 8 for Tensor Cores; use the non-deprecated torch.amp.autocast API
  - Compare loss curve and validation metric with the float32 run
verification:
  - Throughput rises and the validation metric stays within tolerance of float32
  - No NaN or inf in loss or gradients
traps:
  - "Numerics change: some bf16-pretrained models overflow in the float16 range (max 65504) and produce NaNs"
  - binary_cross_entropy and BCELoss raise errors in autocast; use the with-logits variants
  - In-place ops, out= and explicit dtype arguments opt out of autocast
  - Autocast state is thread-local, which matters for DataParallel and multi-GPU setups
  - Ops like softmax, norms and cross_entropy run in float32 by design
expectedEffect: Higher training or inference throughput on supporting hardware, lower memory; varies, measure.
sources:
  - https://docs.pytorch.org/docs/2.14/amp.html
  - https://docs.pytorch.org/tutorials/recipes/recipes/tuning_guide.html
verifiedIn: unverified
