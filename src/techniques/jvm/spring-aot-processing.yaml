id: jvm.spring-aot-processing
domain: jvm
title: Spring AOT processing on the JVM (build-time bean definitions)
kind: guided
riskClass: lossless
stacks:
  - spring-boot
  - jvm
  - maven
  - gradle
bottlenecks:
  - startup
signals:
  - Spring Boot startup actuator endpoint or a BufferingApplicationStartup dump shows large time in configuration class parsing, component scanning, condition evaluation and bean definition registration steps.
  - JFR shows reflection and annotation introspection (ConfigurationClassPostProcessor, ClassPathScanningCandidateComponentProvider) near the top of startup stacks.
  - The deployed artifact has a fixed class path and a fixed set of active profiles.
preconditions:
  - Spring Boot 3 or newer; Maven build using the spring-boot-starter-parent native profile (or an equivalent process-aot execution), or Gradle with the org.springframework.boot.aot plugin.
  - Profiles and condition-relevant properties are known at build time; the class path at runtime equals the build class path. Under these conditions the bean set and behavior are the same as without AOT; if they cannot be fixed, do not apply this card.
steps:
  - "Maven: build the jar with `mvn -Pnative package` so the native profile runs process-aot and the jar includes AOT-generated code. Gradle: apply the `org.springframework.boot.aot` plugin so processAot output is part of the build."
  - "Set the profiles that production uses at build time: Maven `<profiles>profile-a,profile-b</profiles>` in the process-aot execution configuration, Gradle `args('--spring.profiles.active=profile-a,profile-b')` on the ProcessAot task."
  - Run the built jar with `java -Dspring.aot.enabled=true -jar app.jar` so the generated initializers are used.
  - "Remove patterns AOT cannot transform: declare precise @Bean return types, avoid circular dependencies (use @Lazy or ObjectProvider), avoid lambda or method-reference instance suppliers and registerSingleton, flag the preferred constructor with @Autowired when there are several."
  - Combine with the AOT cache or CDS card; the Spring Boot docs state they can be combined to improve startup further.
verification:
  - Startup log shows `Starting AOT-processed <MainClass>`; bean count and endpoints match the non-AOT run.
  - Run the integration test suite against the AOT-enabled build.
  - Compare time-to-ready of A/B arms.
traps:
  - Conditions (@Conditional*, @Profile, property-driven bean presence) are evaluated at build time and hard-coded; profile-specific configuration chosen at build time is enabled at runtime automatically, and properties that decide whether a bean exists (@ConditionalOnProperty, .enabled) are not supported at runtime.
  - Circular dependencies fail to start under AOT; beans registered with registerSingleton or via instance-supplier lambdas cannot be transformed ahead of time.
  - The runtime class path must not differ from the build class path.
  - The jar must actually contain the generated code; if the build does not activate the AOT step, -Dspring.aot.enabled=true has nothing to use (check the startup log line).
  - Benefit on the JVM is smaller than in native image; the Spring Framework docs say AOT is currently focused on native images, with more JVM use cases intended later.
expectedEffect: Less runtime configuration parsing and reflection at startup on the JVM; the docs give no figure; varies, measure.
sources:
  - https://docs.spring.io/spring-framework/reference/core/aot.html
  - https://docs.spring.io/spring-boot/reference/packaging/aot.html
  - https://docs.spring.io/spring-boot/how-to/aot.html
  - https://docs.spring.io/spring-boot/gradle-plugin/aot.html
verifiedIn: unverified
