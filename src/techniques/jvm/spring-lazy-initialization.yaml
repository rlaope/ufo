id: jvm.spring-lazy-initialization
domain: jvm
title: Spring Boot global lazy initialization
kind: guided
riskClass: lossy
stacks: [spring-boot, jvm]
bottlenecks: [startup]
signals:
  - "Spring Boot startup actuator endpoint or BufferingApplicationStartup shows many beans.instantiate steps, many of them not needed for the first request or for the measured workload."
  - "Measured metric is time to context refreshed, and expensive singletons (clients, caches, schedulers) are created eagerly."
preconditions:
  - "Spring Boot (any recent version). The user opted in to errors surfacing later than startup."
  - "A test or oracle exists that exercises all code paths that depend on lazily created beans."
steps:
  - "Set `spring.main.lazy-initialization=true` (or SpringApplication#setLazyInitialization)."
  - "Mark beans that must fail fast or start background work at startup with `@Lazy(false)` (health checks, schedulers, message listeners)."
  - "Tune the heap before and after; the JVM must fit all beans, not only those created at startup."
verification:
  - "Startup actuator endpoint shows fewer instantiated beans before ready."
  - "Full test suite passes; first-request latency measured separately from startup time."
  - "Log or test that misconfigured beans still fail, now at first use."
traps:
  - "Misconfiguration that used to fail at startup now surfaces at first use, in production traffic."
  - "The cost moves to the first request that touches each bean, so p99 of early requests rises; if the metric is time-to-first-response the gain may vanish."
  - "Components that must register themselves at startup (schedulers, listeners, @PostConstruct side effects) silently never run until referenced."
  - "The Spring docs recommend tuning the JVM heap before enabling it."
expectedEffect: "Shorter time to context refreshed when many beans are unused at startup; moves work to first use; varies; measure."
sources:
  - https://docs.spring.io/spring-boot/reference/features/spring-application.html
verifiedIn: unverified
