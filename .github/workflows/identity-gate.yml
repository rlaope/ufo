name: Identity gate

# Its own workflow so that pull requests run the base branch's copy of it: with
# pull_request_target the workflow file and the script come from main, the pull request is only
# fetched as data, and none of its code runs while the secret is in the environment. Pull requests
# from forks are not scanned with the secret (pass or fail would tell an outsider whether their
# text matches it); their commits are scanned on the push to main after a merge.
on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity-gate:
    name: Identity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip a pull request from a fork
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Pull requests from forks are scanned on the push to main after a merge."
      - name: Fetch the pull request's commits as data
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head"
      - name: Scan files, history, and pull requests
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IDENTITY_PATTERN: ${{ secrets.IDENTITY_PATTERN }}
          UFO_GATE_PRS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$IDENTITY_PATTERN" ]; then
            echo "::notice::IDENTITY_PATTERN is not available; skipping the identity gate."
            exit 0
          fi
          # Every commit reachable from any ref is scanned, the pull request's included.
          bash scripts/identity-gate.sh
