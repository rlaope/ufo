name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli/index.js --version

  identity-gate:
    name: Identity gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan files, history, and pull requests
        env:
          IDENTITY_PATTERN: ${{ secrets.IDENTITY_PATTERN }}
          UFO_GATE_PRS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$IDENTITY_PATTERN" ]; then
            echo "::notice::IDENTITY_PATTERN is not available (for example, a pull request from a fork); skipping the identity gate."
            exit 0
          fi
          bash scripts/identity-gate.sh
