name: Release

# Publishes ufo-agents to npm when a version tag (v0.1.0) is pushed, then creates the GitHub
# release. The checklist, and the one-time trusted publisher setup on npmjs.com, are in
# docs/release.md.
#
# npm trusted publishing (OIDC), per npm's docs:
#   https://docs.npmjs.com/trusted-publishers
#   - needs npm CLI 11.5.1 or later and Node 22.14.0 or later, a GitHub-hosted runner, and
#     `id-token: write`; no npm token secret is used or stored.
#   - provenance is generated automatically for a public package from a public repository, so
#     --provenance below only states it; package.json's repository.url must match this
#     repository exactly (https://docs.npmjs.com/generating-provenance-statements).
#   - the workflow filename configured on npmjs.com must be exactly `release.yml`.
#
# Three jobs, so that each secret or permission reaches only the steps that need it: `check`
# runs the repository's code with the identity pattern and no OIDC token; `publish` gets the
# OIDC token and runs no repository code (publishing a tarball runs none of its scripts); the
# GitHub release is the only job that can write to the repository.
#
# The checks below run in the tagged commit's own copy of this file, so a branch with a changed
# release.yml could skip them. What stops that is outside the file (docs/release.md, one-time
# setup): the `npm-release` environment of the publish job, which npm's trusted publisher
# requires and which only `v*` tags may deploy to, and a tag ruleset that lets only the
# repository admin create, move, or delete `v*` tags.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # The only tagger a release tag may have.
  RELEASE_TAGGER_EMAIL: rlaope@users.noreply.github.com

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: Check and pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The identity gate scans every commit; the main check needs origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache in a release: a cache is shared with other workflows' runs.
          package-manager-cache: false
      - name: Check the tag against package.json and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-check.sh "$TAG" >/dev/null
      - name: Check that the tag is by the release tagger, on main, at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-tag-check.sh "$TAG"
      # Dependencies' install scripts do not run (only fsevents has one, macOS-only).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Identity gate over the repository
        env:
          IDENTITY_PATTERN: ${{ secrets.IDENTITY_PATTERN }}
          UFO_GATE_PRS: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$IDENTITY_PATTERN" ]; then
            echo "::error::IDENTITY_PATTERN is not available; no release is published without the identity gate."
            exit 1
          fi
          bash scripts/identity-gate.sh
      - run: npm run audit:deps
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack/contents"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          tar -xzf "$RUNNER_TEMP"/pack/*.tgz -C "$RUNNER_TEMP/pack/contents"
      - name: Identity gate over the packed tarball
        env:
          IDENTITY_PATTERN: ${{ secrets.IDENTITY_PATTERN }}
        run: bash scripts/identity-gate.sh --dir "$RUNNER_TEMP/pack/contents"
      # The tarball the gates passed is the one published.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    # npm's trusted publisher names this environment, so an OIDC token from any other job is
    # refused; its deployment rule admits only v* tags (docs/release.md).
    environment: npm-release
    permissions:
      # The OIDC token npm exchanges for a short-lived publish credential.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Node 22 bundles npm 10, older than the 11.5.1 that OIDC publishing needs.
      - run: npm install --global npm@11.21.0
      - run: npm --version
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # A prerelease (v0.2.0-rc.1) goes to the next dist-tag, never to latest.
          case "$TAG" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          npm publish "$RUNNER_TEMP"/pack/*.tgz --provenance --access public --tag "$dist_tag"

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the release from the CHANGELOG.md section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-check.sh "$TAG" >"$RUNNER_TEMP/notes.md"
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --prerelease="$prerelease"
